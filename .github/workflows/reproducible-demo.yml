name: Reproducible demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-smoke-test:
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked demo dependencies
        run: python -m pip install --requirement requirements-demo.lock

      - name: Run deterministic CLI smoke test
        run: python -m exam_chat_core.demo --self-test

      - name: Run demo and Flask API tests
        env:
          EXAM_CHAT_MODE: demo
          AUTO_OPEN_BROWSER: "false"
        run: python -m unittest discover -s tests -v
